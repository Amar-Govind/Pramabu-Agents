brand:
  name: Parambu Organics
  short_name: Parambu
  tagline: Everyday Pure & Natural
  category: Organic FMCG
  website: https://parambu.in
  platform: WooCommerce
  markets:
    - India
  categories:
    - Hair Care
    - Skin Care
    - Gardening
  category_map:
    Hair Care: Oils
    Skin Care: Soap
    Gardening: Cocopeat
  voice:
    tone: warm, natural, heritage-rooted, trustworthy
    do:
      - Speak like a trusted organic Indian brand
      - Highlight handcrafted and cold-processed quality
      - Keep benefits concrete for skin, hair, and gardening
      - Prefer short sentences and clear Shop Now CTAs
      - Mention chemical-free / pure & natural carefully and truthfully
    dont:
      - Use medical or disease-cure claims
      - Promise whitening, miracle, or clinical results
      - Sound corporate or jargon-heavy
      - Overstate "100% guaranteed" outcomes
  visual:
    primary_colors: ["#B76E79", "#1B4332", "#F7F1E4", "#1A1A1A"]
    logo: /brand/logo-gold.png
    style: rose-gold leaf accent, natural product photography, earthy textures, clean typography, heritage organic feel
  menu:
    - Hair Care (Oils)
    - Skin Care (Soap)
    - Gardening (Cocopeat)
  compliance:
    required_disclaimers: []
    forbidden_claims:
      - cures
      - clinically proven
      - 100% natural guaranteed
      - treats disease
      - medical grade

